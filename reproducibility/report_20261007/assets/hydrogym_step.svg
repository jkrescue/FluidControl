<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 255" role="img" aria-labelledby="title desc">
<title id="title">一次训练交互</title><desc id="desc">69个观测数输入PPO，策略提出转速，项目限制动作，FNO推进流动，然后计算奖励并产生新的69个观测数。</desc>
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#526b7a"/></marker></defs>
<g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#253746" font-size="18" text-anchor="middle">
<g fill="#edf3f7" stroke="#8198a5"><rect x="15" y="30" width="165" height="98" rx="6"/><rect x="205" y="30" width="165" height="98" rx="6"/><rect x="395" y="30" width="165" height="98" rx="6"/><rect x="585" y="30" width="165" height="98" rx="6"/><rect x="775" y="30" width="170" height="98" rx="6"/></g>
<text x="98" y="68" font-weight="600">读取观测</text><text x="98" y="101">69个数</text>
<text x="288" y="68" font-weight="600">PPO提出转速</text><text x="288" y="101">1个动作</text>
<text x="478" y="68" font-weight="600">限制实际动作</text><text x="478" y="101">大小与变化率</text>
<text x="668" y="68" font-weight="600">固定FNO推进</text><text x="668" y="101">0.1 D/U</text>
<text x="860" y="68" font-weight="600">整理返回结果</text><text x="860" y="101">新观测、奖励</text>
<g stroke="#526b7a" stroke-width="2" fill="none" marker-end="url(#arr)"><path d="M180 79H200"/><path d="M370 79H390"/><path d="M560 79H580"/><path d="M750 79H770"/><path d="M860 128V170H98V135"/></g>
<text x="480" y="160">返回新观测，继续下一步；累计5步后切换真实起点</text>
<text x="480" y="217" font-size="19">69 = 32个探针 × 2个速度分量 + 两圆柱 × 阻力/升力 + 当前转速</text>
<text x="480" y="244" font-size="16">示意仅表达数据流；起点、转速、预测值和奖励均由实际程序提供。</text>
</g></svg>
