<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
<title id="title">训练与验证的区别</title><desc id="desc">训练时PPO在HydroGym代理环境中学习；验证时固定策略经项目连接程序控制OpenFOAM，不在线使用FNO代理环境。</desc>
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#526b7a"/></marker></defs>
<g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#253746" font-size="19" text-anchor="middle">
<rect x="15" y="15" width="450" height="265" rx="7" fill="#edf3f7" stroke="#8198a5"/><rect x="495" y="15" width="450" height="265" rx="7" fill="#f1f5f1" stroke="#8198a5"/>
<text x="240" y="48" font-weight="600">策略训练：在代理环境中学习</text><text x="720" y="48" font-weight="600">CFD验证：执行已经训练的策略</text>
<text x="240" y="90">PPO策略（参数更新）</text><text x="720" y="90">PPO策略（参数固定）</text>
<text x="240" y="146">HydroGym + 项目接入程序</text><text x="720" y="146">项目OpenFOAM连接程序</text>
<text x="240" y="202">固定FNO → 预测场、预测受力</text><text x="720" y="202">OpenFOAM → CFD场、CFD受力</text>
<g stroke="#526b7a" stroke-width="2" fill="none" marker-end="url(#arr)"><path d="M240 98V121"/><path d="M240 154V179"/><path d="M720 98V121"/><path d="M720 154V179"/><path d="M414 205V76H358"/><path d="M894 205V76H838"/></g>
<text x="240" y="244" font-size="17">反馈预测观测和奖励，PPO继续学习</text><text x="720" y="244" font-size="17">反馈CFD观测，不继续训练网络</text>
<text x="240" y="269" font-size="16">HydroGym在本项目中的主要使用阶段</text><text x="720" y="269" font-size="16">不在线调用HydroGym代理环境、FNO或MPC</text>
</g></svg>
