<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1030" viewBox="0 0 1200 1030" role="img" aria-labelledby="title desc">
<title id="title">一次交互：HydroGym中的PPO训练与真实CFD部署</title>
<desc id="desc">左列展示代理环境训练：从69维观测产生动作，经转速限制后调用固定FNO预测，再返回新观测和奖励；收集一批交互后更新PPO。右列展示真实验证：冻结PPO从真实CFD观测选择动作，OpenFOAM推进20个时间步，再返回新观测，不训练PPO，不调用FNO。</desc>
<defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#426681"/></marker></defs>
<style>text{font-family:Arial,"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#19344a}.t{font-size:27px;font-weight:700}.h{font-size:21px;font-weight:700}.b{font-size:17px}.s{font-size:15px}.box{fill:white;stroke:#7994a7;stroke-width:1.3;rx:10}.a{stroke:#426681;stroke-width:2.4;fill:none;marker-end:url(#arr)}</style>
<rect width="1200" height="1030" fill="#f8fafc"/>
<text x="32" y="43" class="t">同一个控制问题，两种不同的运行过程</text>
<text x="32" y="73" class="b">动作都是后圆柱转速；每次交互推进0.1 D/U。示意图，不是新增实验结果。</text>
<rect x="24" y="99" width="552" height="866" rx="14" fill="#eaf0fb"/>
<rect x="624" y="99" width="552" height="866" rx="14" fill="#e6f3ec"/>
<text x="45" y="135" class="h">训练：HydroGym接口 + 代理环境</text>
<text x="645" y="135" class="h">验证：冻结PPO + 真实OpenFOAM</text>
<rect x="48" y="156" width="504" height="86" class="box"/>
<text x="66" y="185" class="h">1. 读取当前69个数</text>
<text x="66" y="213" class="b">32个探针的u/v + 前后柱Cd/Cl + 当前转速</text>
<rect x="648" y="156" width="504" height="86" class="box"/>
<text x="666" y="185" class="h">1. 读取真实CFD的69个数</text>
<text x="666" y="213" class="b">探针、前后柱受力、实际施加的转速</text>
<path d="M300 245V272" class="a"/><path d="M900 245V272" class="a"/>
<rect x="48" y="283" width="504" height="86" class="box"/>
<text x="66" y="312" class="h">2. PPO策略提出一个请求转速</text>
<text x="66" y="340" class="b">训练时探索动作；交互记录供随后学习使用</text>
<rect x="648" y="283" width="504" height="86" class="box"/>
<text x="666" y="312" class="h">2. 已训练PPO提出一个请求转速</text>
<text x="666" y="340" class="b">CPU执行；参数固定，不在验证中继续训练</text>
<path d="M300 372V399" class="a"/><path d="M900 372V399" class="a"/>
<rect x="48" y="410" width="504" height="86" class="box"/>
<text x="66" y="439" class="h">3. 限制后得到实际施加的转速</text>
<text x="66" y="467" class="b">|ω| ≤ 0.75；相邻动作变化 |Δω| ≤ 0.1</text>
<rect x="648" y="410" width="504" height="86" class="box"/>
<text x="666" y="439" class="h">3. 使用相同的转速限制</text>
<text x="666" y="467" class="b">只施加一次限制；写入旋转壁面控制表</text>
<path d="M300 499V526" class="a"/><path d="M900 499V526" class="a"/>
<rect x="48" y="537" width="504" height="113" class="box"/>
<text x="66" y="566" class="h">4. 两个固定FNO模拟下一步</text>
<text x="66" y="594" class="b">一个给出下一幅速度/压力场</text>
<text x="66" y="622" class="b">另一个给出前后圆柱的阻力和升力系数</text>
<rect x="648" y="537" width="504" height="113" class="box"/>
<text x="666" y="566" class="h">4. OpenFOAM实际求解下一段流动</text>
<text x="666" y="594" class="b">20个求解时间步 × 0.005 D/U = 0.1 D/U</text>
<text x="666" y="622" class="b">这里不调用FNO预测，也不是MPC选动作</text>
<path d="M300 653V680" class="a"/><path d="M900 653V680" class="a"/>
<rect x="48" y="691" width="504" height="113" class="box"/>
<text x="66" y="720" class="h">5. 形成下一次观测和本步奖励</text>
<text x="66" y="748" class="b">从预测场取探针值，补上预测受力和转速</text>
<text x="66" y="776" class="b">按减阻、升力约束与动作代价计算奖励</text>
<rect x="648" y="691" width="504" height="113" class="box"/>
<text x="666" y="720" class="h">5. 得到下一次真实观测</text>
<text x="666" y="748" class="b">重复1—5，形成真正的状态反馈循环</text>
<text x="666" y="776" class="b">另行推进无控制对照，用真实结果评价收益</text>
<path d="M48 740H36V196H44" class="a"/><path d="M1152 740H1164V196H1156" class="a"/>
<text x="45" y="847" class="h">什么时候更新网络？</text>
<text x="45" y="878" class="b">每采集512条交互，再按PPO规则更新策略。</text>
<text x="45" y="907" class="b">本阶段只训练PPO，FNO保持固定。</text>
<text x="45" y="936" class="s">HydroGym组织交互；FNO是预测器；SB3负责PPO训练。</text>
<text x="645" y="847" class="h">什么时候更新网络？</text>
<text x="645" y="878" class="b">本次真实CFD验证过程中，不更新任何网络。</text>
<text x="645" y="907" class="b">800个控制周期，是80 D/U的验证时长。</text>
<text x="645" y="936" class="s">反馈控制有效，不等于代理预测已全部达标。</text>
<text x="32" y="996" class="s">图中省略了坐标对称变换、重置与错误检查的细节；正文按真实实现逐项解释。</text>
</svg>
