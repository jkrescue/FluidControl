<text x="265" y="90" text-anchor="middle" font-size="17">转速动作</text><text x="675" y="90" text-anchor="middle" font-size="17">调用预测</text>
<text x="672" y="205" text-anchor="middle" font-size="17">下一时刻流场与受力</text><text x="285" y="243" text-anchor="middle" font-size="17">新观测 + 奖励</text>
<text x="480" y="28" text-anchor="middle" font-size="18">前置工作：OpenFOAM生成数据 → PhysicsNeMo训练FNO → 固定FNO后训练PPO</text>
