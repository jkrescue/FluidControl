<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 285" role="img" aria-labelledby="title desc">
<title id="title">本项目训练阶段的软件分工</title><desc id="desc">PPO将动作交给HydroGym与项目环境程序，环境调用FNO并返回观测和奖励；FNO事先使用OpenFOAM数据训练。</desc>
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#526b7a"/></marker></defs>
<g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#253746" font-size="20">
