<text x="117" y="104" text-anchor="middle" font-weight="600">PPO控制策略</text><text x="117" y="140" text-anchor="middle">学习下一次转速</text>
<rect x="315" y="65" width="310" height="110" rx="7" fill="#edf3f7" stroke="#8198a5"/>
<text x="470" y="102" text-anchor="middle" font-weight="600">HydroGym + 项目环境</text><text x="470" y="139" text-anchor="middle">组织交互、观测和奖励</text>
<rect x="725" y="65" width="215" height="110" rx="7" fill="#edf3f7" stroke="#8198a5"/>
