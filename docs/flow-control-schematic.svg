<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="485" viewBox="0 0 1180 485" role="img" aria-labelledby="title desc">
  <title id="title">三圆柱旋转控制的两种作用方式</title>
  <desc id="desc">水流自左向右。每个面板都有一个固定的前圆柱和两个等直径的后圆柱。正控制量时上圆柱顺时针、下圆柱逆时针，间隙射流减弱，尾流趋窄。负控制量时方向相反，间隙射流增强，尾流分开。圆柱位置固定，仅原地旋转。流线仅作机理示意。</desc>
  <defs>
    <marker id="flow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#2385b5"/>
    </marker>
    <marker id="jet-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#e47735"/>
    </marker>
    <style>
      text { font-family: Arial, "Noto Sans CJK SC", "PingFang SC", sans-serif; fill: #17324d; }
      .panel { fill: #f9fcfe; stroke: #bed6e4; stroke-width: 1.5; }
      .h { font-size: 19px; font-weight: 700; }
      .label { font-size: 15px; }
      .small { font-size: 13px; fill: #536879; }
      .body { fill: #dae4e9; stroke: #496579; stroke-width: 2.4; }
      .flow { fill: none; stroke: #2385b5; stroke-width: 3.2; marker-end: url(#flow-arrow); }
      .jet { fill: none; stroke: #e47735; stroke-width: 4.2; marker-end: url(#jet-arrow); }
      .rotation { font-size: 41px; font-weight: 700; fill: #d96048; }
      .dashed { fill: none; stroke: #9eb2bd; stroke-width: 1.5; stroke-dasharray: 5 5; }
    </style>
  </defs>

  <rect x="0" y="0" width="1180" height="485" fill="#ffffff"/>
  <rect class="panel" x="8" y="8" width="572" height="430" rx="10"/>
  <rect class="panel" x="600" y="8" width="572" height="430" rx="10"/>
  <text class="h" x="28" y="40">p &gt; 0：boat-tailing（尾流收窄）</text>
  <text class="h" x="620" y="40">p &lt; 0：base-bleeding（间隙射流增强）</text>

  <!-- Left panel: equal-diameter, equilateral cylinder triangle. -->
  <path class="flow" d="M38 193 H118"/>
  <text class="label" x="35" y="177">来流 U∞ →</text>
  <path class="flow" d="M70 95 C140 95 154 75 220 73 C262 72 275 68 292 65"/>
  <path class="flow" d="M70 297 C140 297 154 317 220 318 C262 319 275 324 292 327"/>
  <path class="flow" d="M375 66 C430 72 450 125 529 155"/>
  <path class="flow" d="M375 326 C430 320 450 267 529 237"/>
  <path class="dashed" d="M375 157 Q470 161 535 176"/>
  <path class="dashed" d="M375 235 Q470 231 535 216"/>
  <path class="jet" d="M366 196 H421" stroke-dasharray="5 7" opacity="0.55"/>
  <circle class="body" cx="195" cy="196" r="49"/>
  <circle class="body" cx="325" cy="121" r="49"/>
  <circle class="body" cx="325" cy="271" r="49"/>
  <text class="label" x="181" y="202">①</text>
  <text class="label" x="311" y="127">②</text>
  <text class="label" x="311" y="277">③</text>
  <text class="rotation" x="310" y="66">↻</text>
  <text class="rotation" x="310" y="352">↺</text>
  <text class="small" x="394" y="191">弱间隙流</text>
  <text class="small" x="430" y="205">外侧流动汇聚</text>
  <text class="small" x="29" y="392">① 固定；② 顺时针；③ 逆时针</text>
  <text class="small" x="29" y="414">圆心距均为 1.5D，三圆柱直径均为 D</text>

  <!-- Right panel: same geometry, opposite rear-cylinder rotation. -->
  <path class="flow" d="M630 193 H710"/>
  <text class="label" x="627" y="177">来流 U∞ →</text>
  <path class="flow" d="M662 95 C732 95 746 75 812 73 C854 72 867 68 884 65"/>
  <path class="flow" d="M662 297 C732 297 746 317 812 318 C854 319 867 324 884 327"/>
  <path class="flow" d="M968 62 C1030 55 1070 78 1140 82"/>
  <path class="flow" d="M968 330 C1030 337 1070 314 1140 310"/>
  <path class="jet" d="M954 196 H1080"/>
  <path class="dashed" d="M968 137 Q1050 122 1140 113"/>
  <path class="dashed" d="M968 255 Q1050 270 1140 279"/>
  <circle class="body" cx="787" cy="196" r="49"/>
  <circle class="body" cx="917" cy="121" r="49"/>
  <circle class="body" cx="917" cy="271" r="49"/>
  <text class="label" x="773" y="202">①</text>
  <text class="label" x="903" y="127">②</text>
  <text class="label" x="903" y="277">③</text>
  <text class="rotation" x="902" y="66">↺</text>
  <text class="rotation" x="902" y="352">↻</text>
  <text class="small" x="994" y="185">强间隙射流</text>
  <text class="small" x="994" y="224">尾流向两侧展开</text>
  <text class="small" x="621" y="392">① 固定；② 逆时针；③ 顺时针</text>
  <text class="small" x="621" y="414">圆柱中心不移动，只改变壁面切向速度</text>

  <text class="small" x="12" y="467">原创机理示意，流线并非实测 PIV 或 CFD 输出；箭头方向按俯视二维平面绘制。</text>
</svg>
