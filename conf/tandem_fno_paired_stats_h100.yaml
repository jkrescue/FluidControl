defaults:
  - tandem_fno_control_train16_h100
  - _self_

# Controlled project-level paired-statistic experiment. The official
# PhysicsNeMo FNO architecture, standard rollout objective, normalization,
# train20+train8+train16 data and validation contract are unchanged.
output_dir: /workspace/output
probe_output: /workspace/output/parent_scale_audit.json
data:
  paired_root: /workspace/base
  paired_manifest: /workspace/pair_manifest.json
training:
  initial_checkpoint: /workspace/parent
  epochs: 2
  # One regular trajectory plus one matched action/zero pair keeps the
  # combined H100 graph below the measured 0.45 unified-memory allocator cap.
  # Both lambda branches use this exact batch contract.
  batch_size: 1
  paired_batch_size: 1
  paired_batches_per_epoch: 16
  max_paired_eval_batches: 16
  paired_stat_horizons: [20, 50, 100]
  paired_stat_loss_weight: 0.0
  force_channel_weights: [1.0, 1.0, 4.0, 1.0]
  max_train_batches: null
  max_validation_batches: null
