defaults:
  - tandem_fno_dynamic_train8_h50
  - _self_

# Same official PhysicsNeMo FNO, train-only data, loss, and TF0 contract as
# H50.  This exploratory run changes horizon, batch size, and training length;
# it is not a strict single-factor ablation.
training:
  epochs: 2
  rollout_steps: 100
  validation_rollout_steps: 100
  batch_size: 2
  gpu_memory_fraction: 0.45
  teacher_forcing_start: 0.0
  teacher_forcing_end: 0.0
  checkpoint_keep_last: 2
