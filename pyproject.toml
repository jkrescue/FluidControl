[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "physicsnemo-fluid-control"
version = "0.1.0"
description = "Action-conditioned PhysicsNeMo flow surrogate for rotating-cylinder wake control"
requires-python = ">=3.11"
dependencies = ["nvidia-physicsnemo>=2.2", "numpy>=2", "torch>=2.10", "matplotlib>=3.8", "h5py>=3.11", "scipy>=1.13", "hydra-core>=1.3", "omegaconf>=2.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint.isort]
known-first-party = ["fluid_control", "train_public_piv", "train_surrogate"]
